name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin: rust_board
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: rust_board.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive (Linux)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist/CRust
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/CRust/
          cp -r templates static locales dist/CRust/
          mkdir -p dist/CRust/uploads
          cp config.example.toml README.md LICENSE dist/CRust/
          tar -czf CRust-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist CRust

      - name: Package release archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/CRust/uploads | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/CRust/
          Copy-Item -Recurse templates, static, locales dist/CRust/
          Copy-Item config.example.toml, README.md, LICENSE dist/CRust/
          Compress-Archive -Path dist/CRust -DestinationPath "CRust-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CRust-*.tar.gz
            CRust-*.zip
